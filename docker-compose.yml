version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ecommerce-test-db
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: ecommerce_test
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d ecommerce_test"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
